<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 446 490" width="446" height="490">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
.term-window {
font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
fill: #c9d1d9;
}
.term-title {
font-size: 13px;
font-weight: 600;
fill: #8b949e;
}
@keyframes fadeInRow {
from { opacity: 0; transform: translateY(2px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes cursorBlink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}
.ascii-row {
font-size: 11px;
fill: #c9d1d9;
opacity: 0;
animation: fadeInRow 0.2s ease-out forwards;
}
.ascii-cursor {
fill: #58a6ff;
animation: cursorBlink 0.6s infinite;
}
.r-0 { animation-delay: 0ms; }
.r-1 { animation-delay: 40ms; }
.r-2 { animation-delay: 80ms; }
.r-3 { animation-delay: 120ms; }
.r-4 { animation-delay: 160ms; }
