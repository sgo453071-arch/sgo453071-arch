<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" width="800" height="110">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
.term-window {
font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
fill: #c9d1d9;
}
.term-title {
font-size: 13px;
font-weight: 600;
fill: #8b949e;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}
.banner-text {
font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
font-size: 14px;
}
.cursor {
fill: #58a6ff;
animation: blink 0.8s infinite;
}
.p-user { fill: #58a6ff; font-weight: bold; }
.p-host { fill: #3fb950; font-weight: bold; }
.p-path { fill: #bc8cff; font-weight: bold; }
.p-cmd  { fill: #c9d1d9; }
</style>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
</filter>
</defs>
<g class="term-window">
<rect x="2" y="2" width="796" height="106" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
<path d="M 2.75,10 Q 2.75,2.75 10,2.75 L 790,2.75 Q 797.25,2.75 797.25,10 L 797.25,36 L 2.75,36 Z" fill="#21262d"/>
<line x1="2" y1="36" x2="798" y2="36" stroke="#30363d" stroke-width="1"/>
<circle cx="16" cy="19" r="5.5" fill="#ff5f56" />
<circle cx="32" cy="19" r="5.5" fill="#ffbd2e" />
<circle cx="48" cy="19" r="5.5" fill="#27c93f" />
<text x="400.0" y="23" text-anchor="middle" class="term-title">bash - sgo453071-arch@github:~</text>
<g transform="translate(0, 36)">
<text x="20" y="32" class="banner-text">
<tspan class="p-user">sgo453071-arch</tspan>
<tspan fill="#c9d1d9">@</tspan>
<tspan class="p-host">github</tspan>
<tspan fill="#c9d1d9">:</tspan>
<tspan class="p-path">~</tspan>
<tspan fill="#c9d1d9">$ </tspan>
<tspan class="p-cmd">whoami &amp;&amp; cat profile.txt</tspan>
<tspan class="cursor"> █</tspan>
</text>
<text x="20" y="58" class="banner-text" font-size="12" fill="#8b949e">
Welcome to sgo453071-arch's interactive terminal workspace. Scroll to explore profile.
</text>
</g>
</g>
</svg>